name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # For CodeQL: a week with no push is still scanned.
  schedule:
    - cron: '0 6 * * 1'

# A new push to a pull request stops the run it replaces. Main's runs never
# cancel, so every merge is tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The run's one fetch. GitHub counts every checkout as a clone, and a job
  # each buried the repository's real clones under its own CI. No credentials
  # are kept, so none ride along in the copy.
  repo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Copy the commit for the other jobs
      run: tar -cf "$RUNNER_TEMP/repo.tar" .

    - name: Hand it over
      uses: actions/upload-artifact@v7
      with:
        name: repo
        path: ${{ runner.temp }}/repo.tar
        retention-days: 1

  lint:
    needs: repo
    runs-on: ubuntu-latest
    steps:
    - &get-repo
      name: Get the commit
      uses: actions/download-artifact@v8
      with:
        name: repo

    - &unpack-repo
      name: Unpack it
      run: tar -xf repo.tar && rm repo.tar

    - &install-uv
      name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - &set-up-python
      name: Set up Python
      run: uv python install 3.14

    - &install-dependencies
      name: Install dependencies
      run: uv sync

    - name: Run linting
      run: uv run ruff check .

  typecheck:
    needs: repo
    runs-on: ubuntu-latest
    steps:
    - *get-repo
    - *unpack-repo
    - *install-uv
    - *set-up-python
    - *install-dependencies

    - name: Run type checking
      run: uv run ty check

  # The suite in two parallel jobs (``--shard``, tests/_shard.py), each
  # running a worker per CPU.
  test-shard:
    name: test ${{ matrix.shard }}/2
    needs: repo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
    - *get-repo
    - *unpack-repo
    - *install-uv
    - *set-up-python
    - *install-dependencies

    - name: Run tests (fails on new N+1 query sites too)
      run: uv run pytest --queryspy-strict --queryspy-baseline .queryspy-baseline.json --shard ${{ matrix.shard }}/2

  # The required check stays ``test``: it passes only when every shard did,
  # so splitting the suite changes nothing branch protection blocks on.
  test:
    if: always()
    needs: [test-shard]
    runs-on: ubuntu-latest
    steps:
    - name: Every shard passed
      run: test "${{ needs.test-shard.result }}" = success

  # Its name is a required check where a repository made it one.
  codeql:
    name: CodeQL Analysis
    if: ${{ !github.event.repository.private }}
    needs: repo
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - *get-repo
    - *unpack-repo

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        # Tests assert on URLs as plain strings ("api.example.com" in a
        # message), which CodeQL reads as URL sanitising: scan the app only.
        config: |
          paths-ignore:
            - tests

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  # Illiana's review of a pull request: docs/services/ai/illiana.md
  # ("Pull Request Review"). Nothing here fails a repository that has not
  # set ILLIANA_BLOCKS.
  illiana:
    name: Illiana
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One review at a time per pull request, so a push never posts a second
    # comment beside the first.
    concurrency:
      group: illiana-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write  # her comment
      issues: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      run: uv python install 3.14

    - name: Install dependencies
      run: uv sync

    - name: Known debt, from the base branch
      # Its code, checked with this branch's environment. A base too old to
      # check keeps the baseline this branch carries.
      run: |
        git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
        if (cd "$RUNNER_TEMP/base" && "$GITHUB_WORKSPACE/.venv/bin/python" -m app.cli.main patterns check --update); then
          cp "$RUNNER_TEMP/base/.patterns-baseline.json" .
        fi

    - name: New findings, annotated
      id: findings
      # Her verdict is held to the last step, so her comment still posts.
      run: |
        set +e
        git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed"
        mapfile -t changed < "$RUNNER_TEMP/changed"
        uv run python -m app.cli.main patterns check --strict "${changed[@]}"
        echo "code=$?" >> "$GITHUB_OUTPUT"

    - name: Is there her app
      id: key
      env:
        APP: ${{ secrets.ILLIANA_APP_ID }}
      run: echo "app=${APP:+true}" >> "$GITHUB_OUTPUT"

    # Her own GitHub App (her name and face on the comment), where its
    # secrets are set; the workflow's bot otherwise, a bad key included.
    - name: Illiana's token
      id: app
      if: steps.key.outputs.app == 'true'
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.ILLIANA_APP_ID }}
        private-key: ${{ secrets.ILLIANA_APP_PRIVATE_KEY }}

    # Her write-up needs a model, so only ILLIANA_REVIEW=model gives her the
    # key (a key alone does not), and the database her agent row is in;
    # without it she still posts the verdict and every place, in the rules'
    # words.
    - name: Illiana's review, on the pull request
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ vars.ILLIANA_REVIEW == 'model' && secrets.OPENAI_API_KEY || '' }}
        AI_PROVIDER: openai
        AI_MODEL: gpt-6-luna
        GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
      run: |
        mapfile -t changed < "$RUNNER_TEMP/changed"
        if [ -n "$OPENAI_API_KEY" ]; then
          uv run alembic -c alembic/alembic.ini upgrade head >&2 \
            || echo "::warning::Migrations failed; her write-up falls back to the rules' words."
        fi
        uv run python -m app.cli.main patterns review "${changed[@]}" \
          --pr "${{ github.event.pull_request.number }}" --commit "${{ github.event.pull_request.head.sha }}"

    - name: Illiana's verdict
      if: vars.ILLIANA_BLOCKS == 'true'
      run: exit "${{ steps.findings.outputs.code }}"
