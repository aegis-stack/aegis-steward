name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # For CodeQL: a week with no push is still scanned.
  schedule:
    - cron: '0 6 * * 1'

# A new push to a pull request stops the run it replaces. Main's runs never
# cancel, so every merge is tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The run's one fetch. GitHub counts every checkout as a clone, and a job
  # each buried the repository's real clones under its own CI. No credentials
  # are kept, so none ride along in the copy.
  repo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Copy the commit for the other jobs
      run: tar -cf "$RUNNER_TEMP/repo.tar" .

    - name: Hand it over
      uses: actions/upload-artifact@v7
      with:
        name: repo
        path: ${{ runner.temp }}/repo.tar
        retention-days: 1

  lint:
    needs: repo
    runs-on: ubuntu-latest
    steps:
    - &get-repo
      name: Get the commit
      uses: actions/download-artifact@v8
      with:
        name: repo

    - &unpack-repo
      name: Unpack it
      run: tar -xf repo.tar && rm repo.tar

    - &install-uv
      name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - &set-up-python
      name: Set up Python
      run: uv python install 3.14

    - &install-dependencies
      name: Install dependencies
      run: uv sync

    - name: Run linting
      run: uv run ruff check .

  typecheck:
    needs: repo
    runs-on: ubuntu-latest
    steps:
    - *get-repo
    - *unpack-repo
    - *install-uv
    - *set-up-python
    - *install-dependencies

    - name: Run type checking
      run: uv run ty check

  # The suite in two parallel jobs (``--shard``, tests/_shard.py), each
  # running a worker per CPU.
  test-shard:
    name: test ${{ matrix.shard }}/2
    needs: repo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
    - *get-repo
    - *unpack-repo
    - *install-uv
    - *set-up-python
    - *install-dependencies

    - name: Run tests (fails on new N+1 query sites too)
      run: uv run pytest --queryspy-strict --queryspy-baseline .queryspy-baseline.json --shard ${{ matrix.shard }}/2

  # The required check stays ``test``: it passes only when every shard did,
  # so splitting the suite changes nothing branch protection blocks on.
  test:
    if: always()
    needs: [test-shard]
    runs-on: ubuntu-latest
    steps:
    - name: Every shard passed
      run: test "${{ needs.test-shard.result }}" = success

  codeql:
    name: CodeQL Analysis
    if: ${{ !github.event.repository.private }}
    needs: repo
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - *get-repo
    - *unpack-repo

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        # Tests assert on URLs as plain strings ("api.example.com" in a
        # message), which CodeQL reads as URL sanitising: scan the app only.
        config: |
          paths-ignore:
            - tests

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
